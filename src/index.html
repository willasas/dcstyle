<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Dark crystal style">
  <meta name="keywords" content="Dark crystal style, DC Style Framework, CSS, HTML, JavaScript">
  <link rel="stylesheet" href="../dist/dc.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />

  <title>Dark crystal style</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: var(--color-white);
        height: 100vh;
        overflow: hidden;
        color: var(--color-text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    }

    .wrap {
        display: flex;
        height: 100vh;
        width: 100%;
        background-color: inherit;
    }

    .section{
      position: relative;
      width: 100%;
      height: 100%;
      flex: 1;
    }

    .main{
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }

    .sidebar {
      width: 260px;
      height: 100%;
      background-color: var(--theme-light);
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      flex-shrink: 0;
      display: none;
    }

    .sidebar.open {
      display: flex;
      transform: translateX(0);
    }

    .sidebar-top {
        padding: 20px 16px;
    }

    .new-chat-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 10px 14px;
        background-color: var(--color-white);
        border: 1px solid var(--color-border-primary);
        border-radius: 28px;
        font-size: 15px;
        font-weight: 500;
        color: var(--color-text-primary);
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 28px;
    }

    .new-chat-btn:hover {
        background-color: var(--color-wisteria-blue-100);
    }

    .history-item {
        padding: 10px 14px;
        border-radius: 24px;
        font-size: 14px;
        color: var(--color-text-primary);
        cursor: pointer;
        transition: background 0.15s;
        margin-bottom: 4px;
    }

    .history-item:hover {
        background-color: var(--color-wisteria-blue-400);
    }

    .history-item.active {
        background-color: var(--color-celadon);
        font-weight: 500;
        color: var(--color-text-secondary);
    }

    .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--color-border-secondary);
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border-radius: 28px;
        cursor: pointer;
    }

    .user-info:hover {
        background-color: var(--theme-gradient);
    }

    .avatar {
        width: 32px;
        height: 32px;
        background: var(--color-electric-indigo);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-white);
        font-weight: 600;
        font-size: 14px;
    }

    .user-details {
        flex: 1;
    }

    .user-name {
        font-size: 14px;
        font-weight: 500;
    }

    .user-email {
        font-size: 12px;
        color: var(--color-text-secondary);
    }

    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: var(--color-white);
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 0 0 0;
        scroll-behavior: smooth;
    }

    .messages-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 24px;
    }

    .message {
        display: flex;
        margin-bottom: 24px;
        animation: fadeIn 0.3s ease;
    }

    .message-ai {
        justify-content: flex-start;
    }

    .message-user {
        justify-content: flex-end;
    }

    .message-bubble-wrapper {
        max-width: 80%;
        display: flex;
        flex-direction: column;
    }

    .message-bubble {
        padding: 12px 18px;
        font-size: 15px;
        line-height: 1.5;
        border-radius: 20px;
        word-break: break-word;
    }

    .message-ai.message-bubble {
        background-color: var(--theme-gradient);
        color: var(--color-white);
        border-top-left-radius: 4px;
    }

    .message-user.message-bubble {
        background-color: var(--theme-gradient);
        color: var(--color-white);
        border-top-right-radius: 4px;
    }

    .message-contentp {
        margin-bottom: 8px;
    }

    .message-contentp:last-child {
        margin-bottom: 0;
    }

    .message-content pre {
        background: var(--color-space-indigo-900);
        color: var(--color-white);
        padding: 12px;
        border-radius: 12px;
        overflow-x: auto;
        margin: 8px 0;
        font-size: 13px;
    }

    .message-actions {
        display: flex;
        gap: 12px;
        margin-top: 6px;
        margin-left: 6px;
        margin-right: 6px;
        opacity: 0.6;
        transition: opacity 0.2s ease;
    }

    .message:hover.message-actions {
        opacity: 1;
    }

    .action-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--color-text-secondary);
        transition: color 0.2s;
    }

    .action-icon:hover {
        color: var(--theme-gradient);
    }

    .action-icon.material-symbols-outlined {
        font-size: 18px;
    }

    .message-user.message-actions {
        justify-content: flex-end;
    }

    .welcome-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 40px 20px 60px;
    }

    .welcome-title {
        font-size: 32px;
        font-weight: 600;
        background: var(--theme-gradient);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin-bottom: 16px;
    }

    .welcome-sub {
        color: var(--color-text-primary);
        font-size: 16px;
    }

    .input-area {
        background: var(--color-white);
        padding: 20px 24px 24px;
    }

    .input-wrapper {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
        background: var(--color-white);
        border: 1px solid var(--color-border-secondary);
        border-radius: 28px;
        transition: border 0.2s, box-shadow 0.2s;
    }

    .message-input {
        width: 100%;
        border: none;
        border-radius: 28px;
        padding: 0 56px 16px 20px;
        font-size: 15px;
        font-family: inherit;
        resize: none;
        outline: none;
        background-color: transparent;
        line-height: 1.5;
        max-height: 200px;
        min-height: 100px;
        margin-bottom: 45px;
        margin-top: 15px;
    }

    .send-btn {
        position: absolute;
        right: 12px;
        bottom: 12px;
        background: var(--theme-gradient);
        border: none;
        color: var(--color-white);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }

    /* 发送按钮禁用状态 */
    .send-btn.disabled {
        background: var(--color-pale-slate-400);
        cursor: not-allowed;
        opacity: 0.6;
    }

    /* 发送按钮禁用时的hover提示效果 */
    .send-btn.disabled:hover::after {
        content: "请输入您的问题";
        position: absolute;
        bottom: 48px;
        right: 0;
        background: var(--color-text-primary);
        color: var(--color-white);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        white-space: nowrap;
        z-index: 100;
        pointer-events: none;
    }

    .send-btn.stop-btn {
        background: var(--color-bubblegum-pink-500);
        animation: pulse 1s infinite;
    }

    .send-btn.stop-btn.disabled {
        background: var(--color-bubblegum-pink-500);
        cursor: pointer;
        opacity: 1;
    }

    .send-btn.stop-btn.disabled:hover::after {
        display: none;
    }

    @keyframes pulse {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }
    }

    .input-inline-options {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: flex;
        gap: 8px;
        z-index: 2;
    }

    .inline-option-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        padding: 6px 12px;
        border-radius: 40px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        background-color: var(--color-black);
        color: var(--color-white);
        border: var(--color-border-secondary) solid 1px;
    }

    .inline-option-btn.active {
        background: var(--theme-gradient);
        color: var(--color-white);
        border: var(--theme-gradient) solid 1px;
    }

    .footer-note {
        text-align: center;
        font-size: 12px;
        color: var(--color-text-secondary);
        margin-top: 16px;
    }

    .footer-note a {
        color: var(--theme-gradient);
        text-decoration: none;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .typing-indicator {
        display: flex;
        gap: 6px;
        padding: 4px 0;
        align-items: center;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        background-color: var(--theme-gradient);
        border-radius: 50%;
        animation: blink 1.4s infinite both;
    }

    @keyframes blink {

        0%,
        80%,
        100% {
            opacity: 0.3;
            transform: scale(0.8);
        }

        40% {
            opacity: 1;
            transform: scale(1);
        }
    }

    .cursor-blink {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background-color: var(--theme-gradient);
        margin-left: 2px;
        animation: blinkCursor 1s infinite;
        vertical-align: middle;
    }

    @keyframes blinkCursor {

        0%,
        50% {
            opacity: 1;
        }

        51%,
        100% {
            opacity: 0;
        }
    }

    .menu-toggle {
      position: absolute;
      top: 4px;
      left: 0;
      z-index: 100;
      background: var(--theme-light);
      /* border-radius: 50%; */
      padding: 8px;
      cursor: pointer;
      /* border: 1px solid var(--color-border-secondary); */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .menu-toggle.active {
      left: 260px;
    }

    .menu-toggle:hover {
      background: var(--color-wisteria-blue-200);
      border-color: var(--theme-gradient);
    }

    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        transform: translateX(-100%);
        z-index: 100;
        background: var(--color-white);
      }
    }

    .menu-toggle svg {
      width: 20px;
      height: 20px;
      transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-toggle .line {
      fill: none;
      stroke: var(--color-text-primary);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      transition: stroke-dasharray 600ms cubic-bezier(0.4, 0, 0.2, 1),
                  stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1),
                  stroke 0.2s ease;
    }

    .menu-toggle:hover .line {
      stroke: var(--color-text-primary);
    }

    .menu-toggle .line-top-bottom {
      stroke-dasharray: 12 63;
    }

    /* 打开状态的动画 */
    .menu-toggle.active svg {
      transform: rotate(-45deg);
    }

    .menu-toggle.active .line-top-bottom {
      stroke-dasharray: 20 300;
      stroke-dashoffset: -32.42;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <!--  -->
    <div class="section">
      <div class="main">
        <div class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 32 32">
            <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
            <path class="line" d="M7 16 27 16"></path>
          </svg>
        </div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="new-chat-btn" id="newChatBtn">
                    <span class="material-symbols-outlined">edit</span>
                    <span>新对话</span>
                </div>
                <div class="history-area">
                    <div class="history-item" data-convo="1">什么是DeepSeek</div>
                    <div class="history-item" data-convo="2">AI 编程助手</div>
                    <div class="history-item" data-convo="3">创意写作灵感</div>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <div class="avatar">诗酒云梦</div>
                    <div class="user-details">
                        <div class="user-name">诗酒云梦</div>
                        <div class="user-email">体验账号</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="chat-messages" id="chatMessages">
                <div class="messages-container" id="messagesContainer">
                    <div id="welcomeScreen" class="welcome-message">
                        <div class="welcome-title">DeepSeek</div>
                        <div class="welcome-sub">你好，我是 DeepSeek AI 助手，有什么可以帮你的？</div>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrapper" id="inputWrapper">
                    <textarea class="message-input" id="messageInput" placeholder="向 DeepSeek 提问..."></textarea>
                    <div class="input-inline-options">
                        <button class="inline-option-btn" id="deepThinkBtn">
                            <span class="material-symbols-outlined">psychology</span>
                            <span>深度思考</span>
                        </button>
                        <button class="inline-option-btn" id="webSearchBtn">
                            <span class="material-symbols-outlined">travel_explore</span>
                            <span>智能搜索</span>
                        </button>
                    </div>
                    <button class="send-btn disabled" id="sendBtn">
                        <span class="material-symbols-outlined">arrow_upward</span>
                    </button>
                </div>
                <div class="footer-note">
                    内容由ai生成，请仔细甄别
                </div>
            </div>
        </main>
      </div>
    </div>
  </div>

  <script src="./js/index.js"></script>
</body>
</html>
